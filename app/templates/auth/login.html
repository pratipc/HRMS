<!-- File Name: login.html -->
<!-- Location: kpcb_hrms/app/templates/auth/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPCB HRMS - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
            z-index: -1;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #818cf8;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #c084fc;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }
        
        .blob-3 {
            width: 300px;
            height: 300px;
            background: #38bdf8;
            bottom: 20%;
            left: 20%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Light Premium Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .glass-input::placeholder {
            color: #94a3b8;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.25rem;
            transition: color 0.3s ease;
        }

        .input-group:focus-within .input-icon {
            color: #6366f1;
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Login Card -->
    <div class="glass-card rounded-3xl p-10 w-full max-w-md mx-4 relative z-10 animate-fade-in-up">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-blue-500 shadow-lg shadow-indigo-500/30 mb-5">
                <i class="ph ph-buildings text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">KPCB HRMS</h1>
            <p class="text-sm text-slate-500 mt-2 font-medium">Welcome back! Please enter your details.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            
            <!-- Error Message Alert Box -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm text-center flex items-center justify-center gap-2">
                <i class="ph-fill ph-warning-circle text-lg"></i>
                <span id="errorText">Invalid credentials.</span>
            </div>

            <!-- Username Field -->
            <div class="space-y-1">
                <label for="username" class="block text-sm font-semibold text-slate-700 ml-1">Username</label>
                <div class="relative input-group">
                    <i class="ph ph-user input-icon"></i>
                    <input type="text" id="username" name="username" required 
                           class="glass-input w-full pl-11 pr-4 py-3 rounded-xl block text-sm" 
                           placeholder="Enter your username">
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1">
                <label for="password" class="block text-sm font-semibold text-slate-700 ml-1">Password</label>
                <div class="relative input-group">
                    <i class="ph ph-lock-key input-icon"></i>
                    <input type="password" id="password" name="password" required 
                           class="glass-input w-full pl-11 pr-4 py-3 rounded-xl block text-sm" 
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Options -->
            <div class="flex items-center justify-between pt-2">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm font-medium text-slate-600 cursor-pointer">Remember me</label>
                </div>
                <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500 transition-colors">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                    class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-300 transform hover:-translate-y-0.5">
                <span>Sign In</span>
                <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- JavaScript logic -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorBox = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            // Reset UI state
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i> <span>Signing in...</span>';
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    submitBtn.innerHTML = '<i class="ph-bold ph-check-circle text-lg"></i> <span>Success!</span>';
                    submitBtn.classList.replace('from-indigo-600', 'from-emerald-500');
                    submitBtn.classList.replace('to-blue-600', 'to-teal-500');
                    submitBtn.classList.replace('hover:from-indigo-700', 'hover:from-emerald-600');
                    submitBtn.classList.replace('hover:to-blue-700', 'hover:to-teal-600');
                    submitBtn.classList.replace('shadow-indigo-500/30', 'shadow-emerald-500/30');
                    
                    setTimeout(() => {
                        // Redirect to the role-specific dashboard URL sent by the API
                        window.location.href = data.redirect_url;
                    }, 500);
                    
                } else {
                    errorText.textContent = data.error || 'Authentication failed.';
                    errorBox.classList.remove('hidden');
                    resetButton();
                }
            } catch (error) {
                errorText.textContent = 'Server connection failed. Please try again.';
                errorBox.classList.remove('hidden');
                resetButton();
            }

            function resetButton() {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                submitBtn.innerHTML = '<span>Sign In</span> <i class="ph-bold ph-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
